name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test:coverage

      # Integration coverage: c8 must be the direct parent of `node`, so we
      # orchestrate spark:up / c8-wrapped test run / spark:down here rather
      # than reusing `pnpm test:integration` (which chains through pnpm+turbo
      # and drops NODE_V8_COVERAGE before it reaches node --test).
      - run: pnpm --filter @spark-connect-js/integration-tests spark:up
      - run: pnpm exec c8 --reporter=lcov --reports-dir=tests/integration/coverage --include='packages/spark-core/dist/**' --include='packages/spark-node/dist/**' node --test $(find tests/integration/dist -name '*.test.js')
      - run: pnpm --filter @spark-connect-js/integration-tests spark:down
        if: always()

      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: packages/spark-core/coverage/lcov.info
          flags: spark-core
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: packages/spark-node/coverage/lcov.info
          flags: spark-node
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: tests/integration/coverage/lcov.info
          flags: integration
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
